<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestão &amp; Prevenção de Evasão — Permanência Estudantil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand-group">
        <span class="brand-mark" aria-hidden="true">PE</span>
        <div>
          <span class="brand-eyebrow">Permanência Estudantil</span>
          <h1 class="brand-title">Gestão &amp; Prevenção de Evasão</h1>
        </div>
      </div>
      <div class="masthead-actions">
        <button type="button" class="api-badge desconhecido" id="api-badge">API: não verificada</button>
        <span class="masthead-divider" aria-hidden="true"></span>
        <button type="button" class="btn btn-ghost" id="btn-macro">Indicadores macro</button>
        <button type="button" class="btn btn-ghost" id="btn-exportar">Exportar</button>
        <button type="button" class="btn btn-ghost" id="btn-importar">Importar</button>
        <input type="file" id="input-importar" accept="application/json,.json" hidden />
      </div>
    </div>
  </header>

  <main class="main">

    <section id="view-list" class="view">
      <div class="api-status" id="api-status" role="status" hidden></div>
      <div class="macro-aviso" id="macro-aviso" role="status" hidden></div>
      <div class="stats-row" id="stats-row"></div>

      <div class="panel-card">
        <div class="panel-header">
          <div>
            <h2 class="panel-title">Alunos matriculados</h2>
            <p class="panel-subtitle">Acompanhamento acadêmico e predição de risco de evasão estudantil</p>
          </div>
          <button class="btn btn-primary" id="btn-new-student">+ Matricular aluno</button>
        </div>

        <div class="toolbar">
          <div class="search-field">
            <label for="search-input">Buscar</label>
            <input id="search-input" type="search" placeholder="Filtrar por nome ou curso..." aria-label="Buscar aluno" />
          </div>
          <div class="filter-field">
            <label for="filtro-risco">Risco</label>
            <select id="filtro-risco" aria-label="Filtrar por risco">
              <option value="">Todos</option>
              <option value="high">Alto</option>
              <option value="mid">Médio</option>
              <option value="low">Baixo</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="filtro-turno">Turno</label>
            <select id="filtro-turno" aria-label="Filtrar por turno">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="filter-field filter-field-course">
            <label for="filtro-curso">Curso</label>
            <select id="filtro-curso" aria-label="Filtrar por curso">
              <option value="">Todos</option>
            </select>
          </div>
          <button class="btn btn-secondary" id="btn-limpar-filtros" type="button">Limpar</button>
        </div>

        <div class="table-wrap">
          <table class="ledger-table" id="students-table">
            <thead>
              <tr>
                <th aria-sort="none"><button class="sort-button" type="button" data-sort="nome" aria-label="Ordenar por aluno">Aluno <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th aria-sort="none"><button class="sort-button" type="button" data-sort="dataMatricula" aria-label="Ordenar por data de matrícula">Matrícula <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th aria-sort="none"><button class="sort-button" type="button" data-sort="frequencia" aria-label="Ordenar por frequência">Frequência <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th aria-sort="none"><button class="sort-button" type="button" data-sort="risco" aria-label="Ordenar por risco de evasão">Risco de evasão <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th class="th-actions"><span class="visually-hidden">Ações</span></th>
              </tr>
            </thead>
            <tbody id="students-tbody">
              <tr class="loading-row"><td colspan="5">Carregando registros...</td></tr>
            </tbody>
          </table>
          <div id="empty-state" class="empty-state" hidden>
            <h3>Nenhum aluno matriculado</h3>
            <p>A lista de alunos ativos aparece aqui assim que a primeira matrícula for registrada.</p>
            <button class="btn btn-primary" id="btn-empty-new">+ Matricular primeiro aluno</button>
          </div>
        </div>
      </div>
    </section>

    <section id="view-detail" class="view" hidden>
      <div class="detail-topbar">
        <button class="btn btn-secondary btn-sm" id="btn-back">← Voltar para a lista</button>
      </div>
      <div id="detail-content"></div>
    </section>

  </main>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="catalogos.js"></script>
<script src="script.js"></script>
</body>
</html>
